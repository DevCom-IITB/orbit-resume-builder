name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  server:
    runs-on: ubuntu-latest

    # add services to make a real MySQL database available for testing ( later )

    env:
      # DB_ENGINE: ${{ vars.DB_ENGINE }}
      # DB_NAME: ${{ vars.DB_NAME }}
      # DB_USER: ${{ vars.DB_USER }}
      # DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      # DB_HOST: ${{ vars.DB_HOST }}
      # DB_PORT: ${{ vars.DB_PORT }}
      DJANGO_DEBUG: ${{ vars.DJANGO_DEBUG }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
      FRONTEND_URLS: ${{ vars.FRONTEND_URLS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: server
      
      - name: Verify Docker availability
        run: |
          docker info

      - name: Build LaTeX image
        run: |
          docker build -t resume-renderer:latest -f server/resume_renderer/Dockerfile server/resume_renderer

      - name: Run tests
        run: |
          pytest
        working-directory: server

      - name: Run ruff
        run: |
          ruff check .
        working-directory: server

  client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
        working-directory: client

      - name: Run lint
        run: |
          npm run lint
        working-directory: client

      - name: Check formatting
        run: |
          npx prettier --check .
        working-directory: client

      - name: Build
        run: |
          npm run build
        working-directory: client